name: Deploy Docusaurus to Edgeone

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装项目依赖
        run: npm ci

      - name: 构建 Docusaurus 静态文件
        run: npm run build

      - name: 安装 Edgeone CLI
        run: npm install -g edgeone --unsafe-perm

      - name: 部署到 Edgeone
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          edgeone pages deploy ./build -n "zood-blog" -t "$EDGEONE_API_TOKEN"
